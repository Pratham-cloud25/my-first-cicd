
name: My First CI

on:
  push:
    branches:
      - main

jobs:
  python-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest

      - name: Build Docker image
        run: docker build -t my-first-cicd .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag my-first-cicd ${{ secrets.DOCKERHUB_USERNAME }}/my-first-cicd:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-first-cicd:latest
     
      - name: Deploy on EC2 using SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull pmt2525/my-first-cicd:latest
            docker rm -f my-first-cicd-container || true
            docker run --name my-first-cicd-container pmt2525/my-first-cicd:latest
            docker logs my-first-cicd-container

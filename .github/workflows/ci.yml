name: My First CI

on: [push]

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest

      - name: Build Docker image
        run: docker build -t my-first-cicd .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag my-first-cicd ${{ secrets.DOCKERHUB_USERNAME }}/my-first-cicd:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-first-cicd:latest
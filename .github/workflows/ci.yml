
name: My First CI

on:
  push:
    branches:
      - main

jobs:
  python-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest

      - name: Build Docker image
        run: docker build -t my-first-cicd .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag my-first-cicd ${{ secrets.DOCKERHUB_USERNAME }}/my-first-cicd:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-first-cicd:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::148761637471:role/GitHubActions-Deploy-Role
          aws-region: us-east-2

      - name: Deploy on EC2 using SSM
        run: |
          aws ssm send-command \
            --instance-ids i-0a7af95589e1a406e \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker pull pmt2525/my-first-cicd:latest","docker rm -f my-first-cicd-container 2>/dev/null || true","docker run --name my-first-cicd-container pmt2525/my-first-cicd:latest","docker logs my-first-cicd-container"]'
